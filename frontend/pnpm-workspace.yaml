allowBuilds:
  "@vaadin/vaadin-usage-statistics": false
  esbuild: false
  workerd: false

overrides:
  # @tanstack/eslint-plugin-router still pins @typescript-eslint/utils 8.38,
  # which predates ESLint 10 and throws "Class extends value undefined" on
  # load. Every other consumer already resolves to 8.65, so force the dedupe.
  # Remove once the plugin ships a release supporting ESLint 10.
  "@typescript-eslint/utils": ^8.65.0

# Require releases to be at least 7 days old. Be conservative.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
